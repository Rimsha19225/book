openapi: 3.0.0
info:
  title: RAG Chatbot API
  description: API for interacting with the RAG chatbot system for digital publications
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://your-deployed-url.com
    description: Production server

paths:
  /v1/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time

  /v1/ingest:
    post:
      summary: Ingest a book for RAG processing
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - title
                - author
              properties:
                file:
                  type: string
                  format: binary
                  description: Book file (PDF, TXT)
                title:
                  type: string
                  description: Book title
                  example: "Digital Publishing Guide"
                author:
                  type: string
                  description: Book author
                  example: "Jane Smith"
      responses:
        '200':
          description: Book successfully ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  book_id:
                    type: string
                    format: uuid
                    description: Unique identifier for the ingested book
                  chunks_count:
                    type: integer
                    description: Number of text chunks created
                  status:
                    type: string
                    example: "success"
        '400':
          description: Invalid input or file format
        '401':
          description: Unauthorized - invalid API key

  /v1/books:
    get:
      summary: List available books
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of available books
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        author:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        chunks_count:
                          type: integer

  /v1/chat:
    post:
      summary: Query the RAG chatbot
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - mode
                - book_id
              properties:
                query:
                  type: string
                  description: User's question about the book
                  example: "What are the main themes in this book?"
                mode:
                  type: string
                  enum: [full, selected]
                  description: Query mode - full book search or selected text
                book_id:
                  type: string
                  format: uuid
                  description: ID of the book to query
                selected_text:
                  type: string
                  description: Text selected by user (required for 'selected' mode)
                  example: "The concept of digital publishing involves..."
                session_id:
                  type: string
                  format: uuid
                  description: Optional session ID to continue conversation
      responses:
        '200':
          description: Generated response with citations
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: AI-generated response to the query
                  sources:
                    type: array
                    description: Citations to relevant book chunks
                    items:
                      type: object
                      properties:
                        chunk_id:
                          type: integer
                          description: ID of the referenced chunk
                        content:
                          type: string
                          description: Content of the referenced chunk
                        page:
                          type: integer
                          description: Page number (if available)
                  session_id:
                    type: string
                    format: uuid
                    description: Session ID for conversation continuity
                  query_time:
                    type: number
                    description: Time taken to process the query in seconds
        '400':
          description: Invalid input parameters
        '401':
          description: Unauthorized - invalid API key
        '404':
          description: Book not found

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API key in the format "Bearer YOUR_API_KEY"